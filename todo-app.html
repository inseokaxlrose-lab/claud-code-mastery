<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 웹페이지의 기본 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록 앱</title>

    <!-- Tailwind CSS 불러오기 (인터넷에서 CSS를 가져와요) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- 배경을 연한 회색으로 설정하고, 내용을 화면 가운데에 배치합니다 -->
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- 전체를 담는 카드 모양의 컨테이너 -->
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <!--
            class 설명:
            - bg-white: 하얀색 배경 (카드처럼 보이게)
            - rounded-2xl: 모서리를 둥글게
            - shadow-xl: 큰 그림자 효과 (입체감)
            - p-8: 안쪽 여백
            - w-full: 가로폭을 꽉 채움
            - max-w-md: 하지만 최대 크기는 중간 크기로 제한 (너무 넓어지지 않게)
        -->

        <!-- 제목 영역 -->
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
            ✅ 할 일 목록
        </h1>

        <!-- 할 일 추가 영역 -->
        <div class="mb-6">
            <!-- 입력 필드와 버튼을 가로로 나란히 배치하는 컨테이너 -->
            <div class="flex gap-2">
                <!--
                    flex: 안의 요소들을 가로로 배치
                    gap-2: 요소들 사이에 간격을 둠
                -->

                <!-- 할 일을 입력하는 텍스트 입력창 -->
                <input
                    type="text"
                    id="todoInput"
                    placeholder="할 일을 입력하세요..."
                    class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors"
                    onkeypress="handleKeyPress(event)"
                />
                <!--
                    id="todoInput": JavaScript에서 이 입력창을 찾기 위한 이름표
                    placeholder: 입력창이 비었을 때 보이는 안내 문구
                    onkeypress: 키보드를 누를 때 실행할 함수 (엔터키로도 추가할 수 있게!)

                    class 설명:
                    - flex-1: 남은 공간을 모두 차지 (버튼 옆 공간을 최대한 사용)
                    - px-4 py-3: 좌우 여백 4, 위아래 여백 3
                    - border-2 border-gray-300: 2px 두께의 회색 테두리
                    - rounded-lg: 모서리를 둥글게
                    - focus:outline-none: 클릭했을 때 기본 테두리 제거
                    - focus:border-blue-500: 클릭했을 때 파란색 테두리
                    - transition-colors: 색상 변화를 부드럽게
                -->

                <!-- 추가 버튼 -->
                <button
                    onclick="addTodo()"
                    class="px-6 py-3 bg-blue-500 text-white font-bold rounded-lg hover:bg-blue-600 transition-colors">
                    추가
                </button>
                <!--
                    onclick="addTodo()": 버튼을 클릭하면 addTodo 함수 실행
                -->
            </div>
        </div>

        <!-- 할 일 목록이 표시될 영역 -->
        <div id="todoList" class="space-y-2">
            <!--
                id="todoList": JavaScript에서 여기에 할 일들을 추가할 거예요
                space-y-2: 할 일들 사이에 세로 간격을 둠
            -->

            <!-- 여기에 할 일 항목들이 동적으로 추가됩니다! -->
            <!-- JavaScript가 자동으로 만들어줄 거예요 -->
        </div>

        <!-- 할 일이 없을 때 보여줄 안내 메시지 -->
        <div id="emptyMessage" class="text-center text-gray-400 mt-8 py-8">
            📋 할 일이 없습니다. 위에서 추가해보세요!
        </div>
    </div>

    <!-- JavaScript 코드 시작 -->
    <script>
        // ========================================
        // 1. 변수 선언: 할 일들을 저장할 배열
        // ========================================
        // 배열(Array)이란? 여러 개의 값을 순서대로 저장하는 상자입니다
        // 예: 쇼핑 목록을 하나의 리스트에 적는 것과 같아요!
        let todos = [];

        // 다음에 추가될 할 일의 ID (고유 번호)
        // 각 할 일을 구별하기 위해 번호를 매깁니다 (학생 번호 같은 거예요!)
        let nextId = 1;

        /**
         * addTodo 함수: 새로운 할 일을 추가하는 함수
         *
         * 이 함수가 하는 일:
         * 1. 입력창에서 텍스트를 가져옵니다
         * 2. 비어있는지 확인합니다
         * 3. 할 일 목록(배열)에 추가합니다
         * 4. 화면을 업데이트합니다
         * 5. 입력창을 비웁니다
         */
        function addTodo() {
            // 1. 입력창 요소를 가져옵니다
            const input = document.getElementById('todoInput');

            // 2. 입력창의 값을 가져와서 앞뒤 공백을 제거합니다
            // trim()은 "   안녕하세요   " → "안녕하세요" 로 만들어줘요
            const text = input.value.trim();

            // 3. 입력값이 비어있는지 확인
            if (text === '') {
                // 비어있으면 경고창을 띄우고 함수를 종료합니다
                alert('할 일을 입력해주세요!');
                return; // 함수를 여기서 멈춥니다
            }

            // 4. 새로운 할 일 객체를 만듭니다
            // 객체(Object)란? 관련된 정보들을 하나로 묶어놓은 것
            const newTodo = {
                id: nextId,           // 고유 번호
                text: text,           // 할 일 내용
                completed: false      // 완료 여부 (처음엔 미완료)
            };

            // 5. todos 배열에 새로운 할 일을 추가합니다
            // push()는 배열의 맨 끝에 추가하는 함수예요
            todos.push(newTodo);

            // 6. 다음 할 일을 위해 ID를 1 증가시킵니다
            nextId++;

            // 7. 화면을 업데이트합니다
            renderTodos();

            // 8. 입력창을 비웁니다 (다음 입력을 위해)
            input.value = '';

            // 9. 입력창에 다시 포커스를 줍니다 (바로 다음 할 일을 입력할 수 있게)
            input.focus();

            console.log('할 일 추가됨:', newTodo);
            console.log('현재 할 일 목록:', todos);
        }

        /**
         * handleKeyPress 함수: 엔터키를 눌렀을 때 할 일을 추가하는 함수
         *
         * 마우스로 버튼을 클릭하지 않고도
         * 키보드의 엔터키만으로 할 일을 추가할 수 있게 해줍니다!
         */
        function handleKeyPress(event) {
            // event.key는 눌린 키가 무엇인지 알려줍니다
            if (event.key === 'Enter') {
                // 엔터키를 눌렀다면 addTodo 함수를 실행
                addTodo();
            }
        }

        /**
         * toggleTodo 함수: 할 일의 완료 상태를 토글(반전)하는 함수
         *
         * 체크박스를 클릭하면 실행됩니다
         * 완료 → 미완료, 미완료 → 완료 로 바꿔줍니다
         */
        function toggleTodo(id) {
            // todos 배열에서 해당 id를 가진 할 일을 찾습니다
            const todo = todos.find(t => t.id === id);
            // find()는 조건에 맞는 첫 번째 항목을 찾아주는 함수예요

            if (todo) {
                // completed 값을 반대로 바꿉니다
                // true → false, false → true
                todo.completed = !todo.completed;

                // 화면을 업데이트합니다
                renderTodos();

                console.log(`할 일 ${id}의 상태 변경:`, todo.completed ? '완료' : '미완료');
            }
        }

        /**
         * deleteTodo 함수: 할 일을 삭제하는 함수
         *
         * 삭제 버튼을 클릭하면 실행됩니다
         */
        function deleteTodo(id) {
            // 사용자에게 정말 삭제할 건지 확인합니다
            if (confirm('정말 삭제하시겠습니까?')) {
                // filter()는 조건에 맞는 항목들만 남기는 함수예요
                // id가 다른 것들만 남기면 = 해당 id를 가진 항목은 삭제!
                todos = todos.filter(t => t.id !== id);

                // 화면을 업데이트합니다
                renderTodos();

                console.log(`할 일 ${id} 삭제됨`);
                console.log('남은 할 일 목록:', todos);
            }
        }

        /**
         * renderTodos 함수: 할 일 목록을 화면에 그려주는 함수
         *
         * 이 함수가 가장 중요합니다!
         * todos 배열의 내용을 보고 HTML을 만들어서 화면에 표시합니다
         */
        function renderTodos() {
            // 1. 할 일 목록을 표시할 영역을 가져옵니다
            const todoList = document.getElementById('todoList');

            // 2. 빈 메시지 영역을 가져옵니다
            const emptyMessage = document.getElementById('emptyMessage');

            // 3. 할 일이 있는지 확인
            if (todos.length === 0) {
                // 할 일이 없으면
                todoList.innerHTML = ''; // 목록을 비우고
                emptyMessage.style.display = 'block'; // 빈 메시지를 보여줍니다
                return;
            } else {
                // 할 일이 있으면
                emptyMessage.style.display = 'none'; // 빈 메시지를 숨깁니다
            }

            // 4. HTML 문자열을 만들 변수
            let html = '';

            // 5. todos 배열의 각 항목마다 HTML을 만듭니다
            // forEach()는 배열의 각 항목을 하나씩 처리하는 함수예요
            todos.forEach(todo => {
                // 할 일 하나를 위한 HTML을 만듭니다
                html += `
                    <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
                        <!-- 체크박스 -->
                        <input
                            type="checkbox"
                            ${todo.completed ? 'checked' : ''}
                            onchange="toggleTodo(${todo.id})"
                            class="w-5 h-5 cursor-pointer"
                        />
                        <!-- 할 일 텍스트 -->
                        <span class="flex-1 ${todo.completed ? 'line-through text-gray-400' : 'text-gray-800'}">
                            ${todo.text}
                        </span>
                        <!-- 삭제 버튼 -->
                        <button
                            onclick="deleteTodo(${todo.id})"
                            class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600 transition-colors">
                            삭제
                        </button>
                    </div>
                `;
                // 위에서 ${...} 는 변수의 값을 문자열에 넣는 방법입니다
                // 예: todo.text가 "공부하기"면 → <span>공부하기</span>
            });

            // 6. 만들어진 HTML을 화면에 표시합니다
            todoList.innerHTML = html;
        }

        // ========================================
        // 페이지가 로드되면 처음에 한 번 실행
        // ========================================
        // 빈 메시지가 보이도록 초기화합니다
        renderTodos();

        // ========================================
        // 전체 코드 흐름 정리
        // ========================================
        //
        // 1. 사용자가 할 일을 입력하고 "추가" 버튼 클릭 (또는 엔터)
        // 2. addTodo() 함수 실행
        // 3. todos 배열에 새 할 일 추가
        // 4. renderTodos() 함수로 화면 업데이트
        //
        // 5. 사용자가 체크박스 클릭
        // 6. toggleTodo() 함수 실행
        // 7. 해당 할 일의 completed 값을 반전
        // 8. renderTodos() 함수로 화면 업데이트
        //
        // 9. 사용자가 삭제 버튼 클릭
        // 10. deleteTodo() 함수 실행
        // 11. todos 배열에서 해당 할 일 제거
        // 12. renderTodos() 함수로 화면 업데이트
        //
        // renderTodos()가 핵심!
        // 데이터(todos 배열)가 바뀔 때마다 화면을 다시 그려줍니다
    </script>
</body>
</html>
