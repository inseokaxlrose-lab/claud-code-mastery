<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 웹페이지의 기본 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스톱워치 앱</title>

    <!-- Tailwind CSS 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- 배경을 그라데이션으로 설정하고, 내용을 화면 가운데에 배치합니다 -->
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

    <!-- 스톱워치를 담는 카드 -->
    <div class="bg-white rounded-3xl shadow-2xl p-12 w-full max-w-md">
        <!--
            class 설명:
            - bg-white: 하얀색 배경
            - rounded-3xl: 모서리를 많이 둥글게
            - shadow-2xl: 큰 그림자 효과
            - p-12: 넉넉한 안쪽 여백
            - w-full max-w-md: 가로폭은 꽉 채우되, 최대 중간 크기로 제한
        -->

        <!-- 제목 -->
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-12">
            ⏱️ 스톱워치
        </h1>

        <!-- 시간 표시 영역 -->
        <div class="bg-gradient-to-r from-indigo-100 to-purple-100 rounded-2xl p-8 mb-8">
            <!-- 그라데이션 배경으로 시간 표시 영역을 강조합니다 -->

            <div class="text-center">
                <!-- 시간을 표시하는 큰 숫자 -->
                <div class="text-6xl font-mono font-bold text-gray-800 tracking-wider" id="display">
                    00:00:00
                </div>
                <!--
                    id="display": JavaScript에서 이 부분의 텍스트를 바꿀 거예요
                    font-mono: 숫자가 일정한 간격으로 표시되는 폰트 (시계처럼!)
                    tracking-wider: 글자 간격을 넓게
                -->

                <!-- 밀리초 표시 (작은 글씨) -->
                <div class="text-2xl font-mono text-gray-500 mt-2" id="milliseconds">
                    000
                </div>
                <!-- 밀리초는 1초를 1000으로 나눈 단위예요 (더 정확한 시간 측정!) -->
            </div>
        </div>

        <!-- 버튼 영역 -->
        <div class="flex gap-4">
            <!-- gap-4: 버튼들 사이에 간격을 둡니다 -->

            <!-- 시작/일시정지 버튼 -->
            <button
                id="startPauseBtn"
                onclick="toggleStartPause()"
                class="flex-1 py-4 px-6 bg-indigo-500 text-white font-bold text-lg rounded-xl hover:bg-indigo-600 transition-all duration-200 transform hover:scale-105 active:scale-95">
                시작
            </button>
            <!--
                id="startPauseBtn": 버튼의 텍스트를 "시작" ↔ "일시정지"로 바꾸기 위해
                flex-1: 남은 공간을 차지
            -->

            <!-- 리셋 버튼 -->
            <button
                onclick="reset()"
                class="flex-1 py-4 px-6 bg-gray-500 text-white font-bold text-lg rounded-xl hover:bg-gray-600 transition-all duration-200 transform hover:scale-105 active:scale-95">
                리셋
            </button>
        </div>

        <!-- 설명 텍스트 -->
        <div class="mt-8 text-center text-gray-500 text-sm">
            💡 시작 버튼을 눌러 스톱워치를 시작하세요
        </div>
    </div>

    <!-- JavaScript 코드 시작 -->
    <script>
        // ========================================
        // 1. 변수 선언
        // ========================================

        // 시간을 저장하는 변수들 (모두 밀리초 단위로 저장)
        let startTime = 0;        // 스톱워치를 시작한 시간
        let elapsedTime = 0;      // 지금까지 경과한 시간
        let timerInterval = null; // 타이머를 제어하는 변수

        // 스톱워치가 현재 실행 중인지 확인하는 변수
        let isRunning = false;

        /**
         * toggleStartPause 함수: 시작/일시정지 버튼을 눌렀을 때 실행되는 함수
         *
         * 토글(Toggle)이란?
         * 스위치를 켜고 끄는 것처럼, 두 상태를 번갈아 바꾸는 것을 말해요
         * 꺼져있으면 켜고, 켜져있으면 끄고!
         */
        function toggleStartPause() {
            if (isRunning) {
                // 현재 실행 중이면 → 일시정지
                pause();
            } else {
                // 현재 멈춰있으면 → 시작
                start();
            }
        }

        /**
         * start 함수: 스톱워치를 시작하는 함수
         *
         * 이 함수가 하는 일:
         * 1. 현재 시간을 기록합니다
         * 2. 매 10밀리초마다 화면을 업데이트하는 타이머를 시작합니다
         * 3. 버튼 텍스트를 "일시정지"로 바꿉니다
         */
        function start() {
            // 1. 현재 시간을 가져옵니다
            // Date.now()는 1970년 1월 1일부터 지금까지의 밀리초를 반환해요
            // elapsedTime을 빼주는 이유: 일시정지 후 다시 시작할 때 이어서 측정하기 위해
            startTime = Date.now() - elapsedTime;

            // 2. 타이머를 시작합니다
            // setInterval()은 "일정 시간마다 반복해서 실행"하는 함수예요
            // 마치 심장 박동처럼 계속 뛰는 거예요!
            // 여기서는 10밀리초(0.01초)마다 updateDisplay 함수를 실행합니다
            timerInterval = setInterval(updateDisplay, 10);

            // 3. 실행 상태를 true로 변경
            isRunning = true;

            // 4. 버튼 텍스트를 "일시정지"로 변경
            document.getElementById('startPauseBtn').textContent = '일시정지';

            // 5. 버튼 색상을 노란색 계열로 변경 (일시정지 상태 표시)
            const btn = document.getElementById('startPauseBtn');
            btn.className = btn.className.replace('bg-indigo-500', 'bg-yellow-500');
            btn.className = btn.className.replace('hover:bg-indigo-600', 'hover:bg-yellow-600');

            console.log('스톱워치 시작!');
        }

        /**
         * pause 함수: 스톱워치를 일시정지하는 함수
         *
         * 이 함수가 하는 일:
         * 1. 타이머를 멈춥니다
         * 2. 버튼 텍스트를 "시작"으로 바꿉니다
         */
        function pause() {
            // 1. 타이머를 중지합니다
            // clearInterval()은 setInterval()로 시작한 타이머를 멈추는 함수예요
            // 마치 심장 박동을 멈추는 것처럼!
            clearInterval(timerInterval);

            // 2. 실행 상태를 false로 변경
            isRunning = false;

            // 3. 버튼 텍스트를 "시작"으로 변경
            document.getElementById('startPauseBtn').textContent = '시작';

            // 4. 버튼 색상을 원래대로 (파란색 계열)
            const btn = document.getElementById('startPauseBtn');
            btn.className = btn.className.replace('bg-yellow-500', 'bg-indigo-500');
            btn.className = btn.className.replace('hover:bg-yellow-600', 'hover:bg-indigo-600');

            console.log('스톱워치 일시정지!');
        }

        /**
         * reset 함수: 스톱워치를 리셋(초기화)하는 함수
         *
         * 이 함수가 하는 일:
         * 1. 타이머를 멈춥니다
         * 2. 모든 시간 변수를 0으로 초기화합니다
         * 3. 화면을 00:00:00으로 초기화합니다
         * 4. 버튼을 원래 상태로 되돌립니다
         */
        function reset() {
            // 1. 타이머가 실행 중이면 멈춥니다
            clearInterval(timerInterval);

            // 2. 모든 시간 변수를 0으로 초기화
            startTime = 0;
            elapsedTime = 0;

            // 3. 실행 상태를 false로 변경
            isRunning = false;

            // 4. 화면을 초기 상태로 되돌립니다
            document.getElementById('display').textContent = '00:00:00';
            document.getElementById('milliseconds').textContent = '000';

            // 5. 버튼을 원래 상태로
            const btn = document.getElementById('startPauseBtn');
            btn.textContent = '시작';
            btn.className = 'flex-1 py-4 px-6 bg-indigo-500 text-white font-bold text-lg rounded-xl hover:bg-indigo-600 transition-all duration-200 transform hover:scale-105 active:scale-95';

            console.log('스톱워치 리셋!');
        }

        /**
         * updateDisplay 함수: 화면에 표시되는 시간을 업데이트하는 함수
         *
         * 이 함수가 가장 중요합니다!
         * 타이머가 실행되는 동안 계속 호출되어 화면을 업데이트합니다
         */
        function updateDisplay() {
            // 1. 현재까지 경과한 시간을 계산합니다 (밀리초 단위)
            // 현재 시간 - 시작 시간 = 경과 시간
            elapsedTime = Date.now() - startTime;

            // 2. 밀리초를 시, 분, 초로 변환합니다
            // 이 부분이 조금 복잡하지만, 천천히 따라가봅시다!

            // 밀리초를 초로 변환 (1초 = 1000밀리초)
            // Math.floor()는 소수점을 버리는 함수예요
            // 예: 1234밀리초 → 1초
            let totalSeconds = Math.floor(elapsedTime / 1000);

            // 시간 계산 (1시간 = 3600초)
            // 예: 3661초 → 1시간
            let hours = Math.floor(totalSeconds / 3600);

            // 분 계산 (1분 = 60초)
            // % 는 나머지를 구하는 연산자예요
            // 예: 3661초 → 3661 % 3600 = 61초 → 61 / 60 = 1분
            let minutes = Math.floor((totalSeconds % 3600) / 60);

            // 초 계산
            // 예: 3661초 → 3661 % 60 = 1초
            let seconds = totalSeconds % 60;

            // 밀리초 계산 (3자리만 표시)
            // 예: 1234밀리초 → 1234 % 1000 = 234
            let milliseconds = elapsedTime % 1000;

            // 3. 숫자를 2자리 형식으로 포맷팅합니다
            // formatTime() 함수를 사용해서 "1" → "01" 로 만들어줘요
            const formattedTime =
                formatTime(hours) + ':' +
                formatTime(minutes) + ':' +
                formatTime(seconds);

            // 밀리초는 3자리로 포맷팅
            const formattedMilliseconds = formatMilliseconds(milliseconds);

            // 4. 화면에 표시합니다
            document.getElementById('display').textContent = formattedTime;
            document.getElementById('milliseconds').textContent = formattedMilliseconds;
        }

        /**
         * formatTime 함수: 숫자를 2자리 문자열로 만드는 함수
         *
         * 예시:
         * 1 → "01"
         * 9 → "09"
         * 10 → "10"
         * 59 → "59"
         *
         * 왜 이렇게 하나요?
         * 시계는 항상 2자리로 표시되잖아요! (예: 09:05:03)
         */
        function formatTime(time) {
            // 숫자를 문자열로 변환하고, 앞에 0을 붙입니다
            // padStart(2, '0')는 "문자열을 2자리로 만들되, 부족하면 앞에 0을 채워라"
            return time.toString().padStart(2, '0');
        }

        /**
         * formatMilliseconds 함수: 밀리초를 3자리 문자열로 만드는 함수
         *
         * 예시:
         * 1 → "001"
         * 50 → "050"
         * 999 → "999"
         */
        function formatMilliseconds(ms) {
            // 밀리초를 3자리로 포맷팅
            return ms.toString().padStart(3, '0');
        }

        // ========================================
        // 전체 코드 흐름 정리
        // ========================================
        //
        // 1. 사용자가 "시작" 버튼 클릭
        // 2. toggleStartPause() → start() 실행
        // 3. setInterval()로 10밀리초마다 updateDisplay() 실행 시작
        // 4. updateDisplay()가 계속 호출되면서 화면의 시간이 증가
        //
        // 5. 사용자가 "일시정지" 버튼 클릭
        // 6. toggleStartPause() → pause() 실행
        // 7. clearInterval()로 타이머 중지
        //
        // 8. 사용자가 "리셋" 버튼 클릭
        // 9. reset() 실행
        // 10. 모든 값을 초기화하고 화면을 00:00:00으로 되돌림
        //
        // 핵심 개념:
        // - setInterval(): 일정 시간마다 반복 실행 (심장 박동처럼!)
        // - clearInterval(): 반복 실행 중지
        // - Date.now(): 현재 시간을 밀리초로 가져오기
        // - 시간 계산: 밀리초 → 초 → 분 → 시간으로 변환
    </script>
</body>
</html>
